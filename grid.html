<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid — Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#0a0a0a; --surface:#111; --surface2:#1a1a1a; --surface3:#222;
    --border:#2a2a2a; --border2:#333; --text:#f0ece4; --muted:#666;
    --accent:#6abf69; --accent2:#4a9f49; --radius:4px;
    --cell-h:26px; --row-w:50px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  
  .topbar { display:flex; align-items:center; gap:16px; padding:0 20px; height:52px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .home-link { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--accent); text-decoration:none; }
  .home-link:hover { opacity:0.7; }
  .app-name { font-size:13px; color:var(--muted); }
  .divider { width:1px; height:20px; background:var(--border); }
  .doc-title-input { flex:1; background:none; border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; outline:none; padding:4px 8px; border-radius:var(--radius); transition:background 0.2s; }
  .doc-title-input:hover, .doc-title-input:focus { background:var(--surface2); }
  .save-status { font-size:12px; color:var(--muted); white-space:nowrap; }
  .btn { padding:7px 16px; border:1px solid var(--border); background:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; border-radius:var(--radius); transition:all 0.2s; font-weight:500; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn-accent { background:var(--accent); border-color:var(--accent); color:#000; }
  .btn-accent:hover { opacity:0.85; color:#000; }

  /* Formula bar */
  .formula-bar { display:flex; align-items:center; gap:0; height:36px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .cell-ref { width:80px; text-align:center; font-family:'DM Mono',monospace; font-size:12px; border-right:1px solid var(--border); padding:0 8px; color:var(--accent); height:100%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .formula-eq { padding:0 10px; color:var(--muted); font-family:'DM Mono',monospace; border-right:1px solid var(--border); height:100%; display:flex; align-items:center; flex-shrink:0; }
  .formula-input { flex:1; background:none; border:none; color:var(--text); font-family:'DM Mono',monospace; font-size:13px; padding:0 12px; outline:none; height:100%; }

  /* Layout */
  .sheet-layout { display:flex; flex:1; overflow:hidden; }
  
  /* Sidebar */
  .sidebar { width:200px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-header { padding:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebar-title { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); font-weight:500; }
  .sidebar-new { width:22px; height:22px; background:var(--accent); border:none; color:#000; border-radius:var(--radius); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .doc-list { flex:1; overflow-y:auto; padding:6px; }
  .sidebar-doc { padding:8px 10px; border-radius:var(--radius); cursor:pointer; transition:background 0.15s; border:1px solid transparent; margin-bottom:2px; position:relative; }
  .sidebar-doc:hover { background:var(--surface2); }
  .sidebar-doc.active { background:rgba(106,191,105,0.1); border-color:rgba(106,191,105,0.3); }
  .sidebar-doc-title { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
  .sidebar-doc-date { font-size:10px; color:var(--muted); }
  .sidebar-doc-del { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; opacity:0; font-size:12px; }
  .sidebar-doc:hover .sidebar-doc-del { opacity:1; }
  .sidebar-doc-del:hover { color:#e85447; }
  .no-docs-msg { font-size:12px; color:var(--muted); padding:12px; text-align:center; line-height:1.5; }

  /* Grid area */
  .grid-area { flex:1; overflow:auto; position:relative; }
  .grid-area::-webkit-scrollbar { width:8px; height:8px; }
  .grid-area::-webkit-scrollbar-track { background:var(--surface); }
  .grid-area::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  .grid-table { border-collapse:collapse; table-layout:fixed; }
  .grid-table th, .grid-table td {
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    height:var(--cell-h); font-size:12px; padding:0 6px; white-space:nowrap; overflow:hidden;
  }
  .corner-th { width:var(--row-w); background:var(--surface2); border-right:1px solid var(--border2); position:sticky; top:0; left:0; z-index:10; }
  .col-header {
    background:var(--surface2); text-align:center; font-family:'DM Sans',sans-serif;
    font-weight:600; font-size:11px; letter-spacing:0.5px; color:var(--muted);
    cursor:default; user-select:none; min-width:80px; position:sticky; top:0; z-index:5;
  }
  .col-header.selected-col { background:rgba(106,191,105,0.12); color:var(--accent); }
  .row-header {
    width:var(--row-w); background:var(--surface2); text-align:center; font-family:'DM Mono',monospace;
    font-size:11px; color:var(--muted); cursor:default; user-select:none;
    position:sticky; left:0; z-index:4; border-right:1px solid var(--border2);
  }
  .row-header.selected-row { background:rgba(106,191,105,0.12); color:var(--accent); }
  .grid-cell {
    font-family:'DM Mono',monospace; font-size:12px; color:var(--text);
    cursor:cell; user-select:none; background:var(--bg); text-align:right;
    min-width:80px;
  }
  .grid-cell.text-cell { text-align:left; }
  .grid-cell.selected { background:rgba(106,191,105,0.1); outline:2px solid var(--accent); outline-offset:-1px; }
  .grid-cell.in-range { background:rgba(106,191,105,0.05); }

  /* Context menu */
  .ctx-menu { position:fixed; background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius); padding:4px 0; min-width:160px; z-index:1000; display:none; }
  .ctx-menu.visible { display:block; }
  .ctx-item { padding:8px 16px; font-size:12px; cursor:pointer; }
  .ctx-item:hover { background:var(--surface3); color:var(--accent); }
  .ctx-sep { height:1px; background:var(--border); margin:4px 0; }

  /* Guest banner */
  .guest-banner {
    display:none; align-items:center; justify-content:space-between;
    padding:10px 24px; background:rgba(232,197,71,0.1);
    border-bottom:1px solid rgba(232,197,71,0.25); flex-shrink:0;
  }
  .guest-banner.visible { display:flex; }
  .guest-banner-text { font-size:13px; color:var(--accent,#e8c547); font-weight:400; }
  .guest-banner-text span { opacity:0.7; font-weight:300; margin-left:8px; font-size:12px; }
  .guest-sign-in { padding:6px 16px; background:var(--accent,#e8c547); border:none; color:#000; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; border-radius:4px; }
  .guest-sign-in:hover { opacity:0.85; }

</style>
</head>
<body>

<div class="guest-banner" id="guest-banner">
  <div class="guest-banner-text">
    ⚡ You're using Forge as a guest
    <span>Your work won't be saved to the cloud</span>
  </div>
  <button class="guest-sign-in" onclick="window.location.href='index.html'">Sign In to Save</button>
</div>

<div class="topbar">
  <a href="index.html" class="home-link">FORGE</a>
  <div class="divider"></div>
  <span class="app-name">Grid</span>
  <div class="divider"></div>
  <input class="doc-title-input" id="doc-title" value="Untitled Spreadsheet" placeholder="Spreadsheet title...">
  <span class="save-status" id="save-status"></span>
  <button class="btn btn-accent" onclick="saveDocument()">Save</button>
  <button class="btn" onclick="newDocument()">+ New</button>
</div>

<div class="formula-bar">
  <div class="cell-ref" id="cell-ref">A1</div>
  <div class="formula-eq">fx</div>
  <input class="formula-input" id="formula-input" placeholder="Enter value or formula (=SUM, =AVERAGE, =IF...)" onkeydown="formulaKeydown(event)">
</div>

<div class="sheet-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Sheets</span>
      <button class="sidebar-new" onclick="newDocument()" title="New">+</button>
    </div>
    <div class="doc-list" id="doc-list"><div class="no-docs-msg">Loading...</div></div>
  </div>
  <div class="grid-area" id="grid-area">
    <table class="grid-table" id="grid-table"></table>
  </div>
</div>

<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" onclick="ctxInsertRowAbove()">Insert row above</div>
  <div class="ctx-item" onclick="ctxInsertRowBelow()">Insert row below</div>
  <div class="ctx-item" onclick="ctxInsertColLeft()">Insert column left</div>
  <div class="ctx-item" onclick="ctxInsertColRight()">Insert column right</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxDeleteRow()">Delete row</div>
  <div class="ctx-item" onclick="ctxDeleteCol()">Delete column</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxClearCell()">Clear cell</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jrhakmidckqpulfnksyt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaGFrbWlkY2txcHVsZm5rc3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjQ5NzYsImV4cCI6MjA5NDU0MDk3Nn0.FhQEhpGhFw1NdcDtdNci1rbB4ATlB71rxuVp99Nv4mA';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ROWS = 50, COLS = 26;
let cells = {}; // {row_col: value}
let selectedCell = {r:0, c:0};
let currentUser = null, currentDocId = null, autoSaveTimer = null;
let ctxRow = 0, ctxCol = 0;

function colName(c) { return String.fromCharCode(65+c); }
function cellKey(r,c) { return `${r}_${c}`; }

function buildGrid() {
  const table = document.getElementById('grid-table');
  let html = '<thead><tr><th class="corner-th"></th>';
  for(let c=0;c<COLS;c++) html += `<th class="col-header" id="ch_${c}">${colName(c)}</th>`;
  html += '</tr></thead><tbody>';
  for(let r=0;r<ROWS;r++) {
    html += `<tr><td class="row-header" id="rh_${r}">${r+1}</td>`;
    for(let c=0;c<COLS;c++) {
      html += `<td class="grid-cell" id="cell_${r}_${c}" onclick="selectCell(${r},${c})" ondblclick="editCell(${r},${c})" oncontextmenu="showCtx(event,${r},${c})"></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

function refreshCell(r, c) {
  const el = document.getElementById(`cell_${r}_${c}`);
  if (!el) return;
  const raw = cells[cellKey(r,c)] || '';
  const displayed = evaluateFormula(raw, r, c);
  el.textContent = displayed;
  el.classList.toggle('text-cell', typeof displayed === 'string' && isNaN(displayed) && displayed !== '');
}

function evaluateFormula(val, r, c) {
  if (!val || !val.toString().startsWith('=')) return val;
  try {
    let expr = val.slice(1).toUpperCase();
    // Replace cell refs like A1 with values
    expr = expr.replace(/([A-Z])(\d+)/g, (_, col, row) => {
      const ci = col.charCodeAt(0)-65, ri = parseInt(row)-1;
      const v = cells[cellKey(ri,ci)] || 0;
      return isNaN(v) ? `"${v}"` : (parseFloat(v)||0);
    });
    // Handle SUM(A1:A10)
    expr = expr.replace(/SUM\(([A-Z])(\d+):([A-Z])(\d+)\)/g, (_, c1, r1, c2, r2) => {
      let sum = 0;
      for(let ri=parseInt(r1)-1;ri<=parseInt(r2)-1;ri++)
        for(let ci=c1.charCodeAt(0)-65;ci<=c2.charCodeAt(0)-65;ci++)
          sum += parseFloat(cells[cellKey(ri,ci)])||0;
      return sum;
    });
    expr = expr.replace(/AVERAGE\(([A-Z])(\d+):([A-Z])(\d+)\)/g, (_, c1, r1, c2, r2) => {
      let sum=0, count=0;
      for(let ri=parseInt(r1)-1;ri<=parseInt(r2)-1;ri++)
        for(let ci=c1.charCodeAt(0)-65;ci<=c2.charCodeAt(0)-65;ci++) {
          const v = parseFloat(cells[cellKey(ri,ci)]);
          if(!isNaN(v)) { sum+=v; count++; }
        }
      return count ? sum/count : 0;
    });
    expr = expr.replace(/MAX\(([A-Z])(\d+):([A-Z])(\d+)\)/g, (_, c1, r1, c2, r2) => {
      let vals = [];
      for(let ri=parseInt(r1)-1;ri<=parseInt(r2)-1;ri++)
        for(let ci=c1.charCodeAt(0)-65;ci<=c2.charCodeAt(0)-65;ci++) {
          const v = parseFloat(cells[cellKey(ri,ci)]);
          if(!isNaN(v)) vals.push(v);
        }
      return vals.length ? Math.max(...vals) : 0;
    });
    expr = expr.replace(/MIN\(([A-Z])(\d+):([A-Z])(\d+)\)/g, (_, c1, r1, c2, r2) => {
      let vals = [];
      for(let ri=parseInt(r1)-1;ri<=parseInt(r2)-1;ri++)
        for(let ci=c1.charCodeAt(0)-65;ci<=c2.charCodeAt(0)-65;ci++) {
          const v = parseFloat(cells[cellKey(ri,ci)]);
          if(!isNaN(v)) vals.push(v);
        }
      return vals.length ? Math.min(...vals) : 0;
    });
    const result = Function(`"use strict"; return (${expr})`)();
    return isNaN(result) ? result : (Number.isInteger(result) ? result : parseFloat(result.toFixed(10)));
  } catch(e) { return '#ERR'; }
}

function selectCell(r, c) {
  const prev = document.getElementById(`cell_${selectedCell.r}_${selectedCell.c}`);
  if(prev) prev.classList.remove('selected');
  selectedCell = {r, c};
  const el = document.getElementById(`cell_${r}_${c}`);
  if(el) el.classList.add('selected');
  document.getElementById('cell-ref').textContent = `${colName(c)}${r+1}`;
  document.getElementById('formula-input').value = cells[cellKey(r,c)] || '';
}

function editCell(r, c) {
  selectCell(r, c);
  const fi = document.getElementById('formula-input');
  fi.focus();
  fi.select();
}

function formulaKeydown(e) {
  if (e.key === 'Enter') {
    commitFormula();
    selectCell(Math.min(selectedCell.r+1, ROWS-1), selectedCell.c);
    e.preventDefault();
  } else if (e.key === 'Tab') {
    commitFormula();
    selectCell(selectedCell.r, Math.min(selectedCell.c+1, COLS-1));
    e.preventDefault();
  } else if (e.key === 'Escape') {
    document.getElementById('formula-input').value = cells[cellKey(selectedCell.r, selectedCell.c)] || '';
  }
}

function commitFormula() {
  const val = document.getElementById('formula-input').value;
  const key = cellKey(selectedCell.r, selectedCell.c);
  if (val === '') delete cells[key]; else cells[key] = val;
  refreshCell(selectedCell.r, selectedCell.c);
  scheduleAutoSave();
}

document.addEventListener('keydown', e => {
  if (document.activeElement === document.getElementById('formula-input')) return;
  const {r, c} = selectedCell;
  if(e.key==='ArrowUp') { selectCell(Math.max(r-1,0),c); e.preventDefault(); }
  else if(e.key==='ArrowDown') { selectCell(Math.min(r+1,ROWS-1),c); e.preventDefault(); }
  else if(e.key==='ArrowLeft') { selectCell(r,Math.max(c-1,0)); e.preventDefault(); }
  else if(e.key==='ArrowRight') { selectCell(r,Math.min(c+1,COLS-1)); e.preventDefault(); }
  else if(e.key==='Delete'||e.key==='Backspace') { delete cells[cellKey(r,c)]; refreshCell(r,c); document.getElementById('formula-input').value=''; scheduleAutoSave(); }
  else if(e.key==='Enter') { document.getElementById('formula-input').focus(); }
  else if(e.key.length===1 && !e.ctrlKey && !e.metaKey) { document.getElementById('formula-input').value=e.key; document.getElementById('formula-input').focus(); }
});

// Context menu
function showCtx(e, r, c) { e.preventDefault(); selectCell(r,c); ctxRow=r; ctxCol=c; const m=document.getElementById('ctx-menu'); m.style.left=e.clientX+'px'; m.style.top=e.clientY+'px'; m.classList.add('visible'); }
document.addEventListener('click', () => document.getElementById('ctx-menu').classList.remove('visible'));
function ctxInsertRowAbove() { ROWS++; insertRow(ctxRow); }
function ctxInsertRowBelow() { ROWS++; insertRow(ctxRow+1); }
function ctxInsertColLeft() { COLS++; buildGrid(); refreshAll(); }
function ctxInsertColRight() { COLS++; buildGrid(); refreshAll(); }
function ctxDeleteRow() { if(ROWS<=1) return; const newCells={}; Object.entries(cells).forEach(([k,v])=>{ const [r,c]=k.split('_').map(Number); if(r<ctxRow) newCells[k]=v; else if(r>ctxRow) newCells[`${r-1}_${c}`]=v; }); cells=newCells; ROWS--; buildGrid(); refreshAll(); }
function ctxDeleteCol() { if(COLS<=1) return; const newCells={}; Object.entries(cells).forEach(([k,v])=>{ const [r,c]=k.split('_').map(Number); if(c<ctxCol) newCells[k]=v; else if(c>ctxCol) newCells[`${r}_${c-1}`]=v; }); cells=newCells; COLS--; buildGrid(); refreshAll(); }
function ctxClearCell() { delete cells[cellKey(ctxRow,ctxCol)]; refreshCell(ctxRow,ctxCol); document.getElementById('formula-input').value=''; }

function insertRow(pos) { const newCells={}; Object.entries(cells).forEach(([k,v])=>{ const [r,c]=k.split('_').map(Number); if(r<pos) newCells[k]=v; else newCells[`${r+1}_${c}`]=v; }); cells=newCells; buildGrid(); refreshAll(); }
function refreshAll() { Object.keys(cells).forEach(k=>{ const [r,c]=k.split('_').map(Number); refreshCell(r,c); }); selectCell(selectedCell.r, selectedCell.c); }

// Supabase
function scheduleAutoSave() { clearTimeout(autoSaveTimer); setStatus('Unsaved','#e8874a'); autoSaveTimer = setTimeout(saveDocument, 3000); }
function setStatus(msg, color='var(--muted)') { const el=document.getElementById('save-status'); el.textContent=msg; el.style.color=color; }

async function saveDocument() {
  if(!currentUser) { guestSaveCheck(); return; }
  const title = document.getElementById('doc-title').value || 'Untitled Spreadsheet';
  const content = JSON.stringify({ cells, rows: ROWS, cols: COLS });
  setStatus('Saving...');
  const payload = { user_id: currentUser.id, app:'grid', title, content, updated_at: new Date().toISOString() };
  let result;
  if(currentDocId) { const {data}=await sb.from('documents').update(payload).eq('id',currentDocId).select().single(); result=data; }
  else { const {data}=await sb.from('documents').insert(payload).select().single(); result=data; if(result) { currentDocId=result.id; history.replaceState(null,'',`?doc=${result.id}`); } }
  if(result) { setStatus('Saved ✓','var(--accent)'); await loadDocList(); }
  else setStatus('Save failed','#e85447');
}

async function loadDoc(id) {
  const {data}=await sb.from('documents').select('*').eq('id',id).single();
  if(data) {
    currentDocId=data.id;
    document.getElementById('doc-title').value=data.title||'Untitled Spreadsheet';
    try {
      const parsed=JSON.parse(data.content||'{}');
      cells=parsed.cells||{};
      ROWS=parsed.rows||50; COLS=parsed.cols||26;
    } catch(e) { cells={}; }
    buildGrid(); refreshAll(); setStatus('');
    document.querySelectorAll('.sidebar-doc').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  }
}

async function loadDocList() {
  if(!currentUser) { document.getElementById('doc-list').innerHTML='<div class="no-docs-msg">Sign in to load<br>saved sheets.</div>'; return; }
  const {data}=await sb.from('documents').select('*').eq('user_id',currentUser.id).eq('app','grid').order('updated_at',{ascending:false});
  const list=document.getElementById('doc-list');
  if(!data||data.length===0) { list.innerHTML='<div class="no-docs-msg">No spreadsheets yet.</div>'; return; }
  list.innerHTML=data.map(doc=>`
    <div class="sidebar-doc ${doc.id===currentDocId?'active':''}" data-id="${doc.id}" onclick="loadDoc('${doc.id}')">
      <div class="sidebar-doc-title">${doc.title||'Untitled'}</div>
      <div class="sidebar-doc-date">${new Date(doc.updated_at).toLocaleDateString()}</div>
      <button class="sidebar-doc-del" onclick="event.stopPropagation();deleteDoc('${doc.id}')" title="Delete">✕</button>
    </div>`).join('');
}

async function deleteDoc(id) {
  if(!confirm('Delete this spreadsheet?')) return;
  await sb.from('documents').delete().eq('id',id);
  if(id===currentDocId) newDocument();
  await loadDocList();
}

function newDocument() {
  currentDocId=null; cells={}; ROWS=50; COLS=26;
  document.getElementById('doc-title').value='Untitled Spreadsheet';
  buildGrid(); setStatus('');
  history.replaceState(null,'','grid.html');
}

async function init() {
  const {data:{user}}=await sb.auth.getUser();
  const isGuest=!user;
  if(!user && !sessionStorage.getItem('forge_guest')) { window.location.href='index.html'; return; }
  currentUser=user||null;
  if(isGuest) document.getElementById('guest-banner').classList.add('visible');
  buildGrid();
  selectCell(0,0);
  await loadDocList();
  const params=new URLSearchParams(location.search);
  if(params.get('doc')) await loadDoc(params.get('doc'));
  document.getElementById('doc-title').addEventListener('input', scheduleAutoSave);
}

init();
// Guest save interception
function guestSaveCheck() {
  if (!currentUser) {
    if (confirm('You\'re using Forge as a guest. Sign in to save your work to the cloud.\n\nGo to sign in?')) {
      window.location.href = 'index.html';
    }
    return false;
  }
  return true;
}

</script>
</body>
</html>
