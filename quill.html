<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill — Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a; --border: #2a2a2a;
    --text: #f0ece4; --muted: #666; --accent: #5b9bd5; --radius: 4px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* Topbar */
  .topbar {
    display:flex; align-items:center; gap:16px; padding:0 20px; height:52px;
    border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;
  }
  .home-link {
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px;
    color:var(--accent); text-decoration:none; transition:opacity 0.2s;
  }
  .home-link:hover { opacity:0.7; }
  .app-name { font-size:13px; color:var(--muted); font-weight:300; }
  .divider { width:1px; height:20px; background:var(--border); }
  .doc-title-input {
    flex:1; background:none; border:none; color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:14px; font-weight:500; outline:none; padding:4px 8px;
    border-radius:var(--radius); transition:background 0.2s;
  }
  .doc-title-input:hover { background:var(--surface2); }
  .doc-title-input:focus { background:var(--surface2); }
  .save-status { font-size:12px; color:var(--muted); white-space:nowrap; }
  .btn { padding:7px 16px; border:1px solid var(--border); background:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; border-radius:var(--radius); transition:all 0.2s; font-weight:500; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn-accent { background:var(--accent); border-color:var(--accent); color:#000; }
  .btn-accent:hover { opacity:0.85; color:#000; }

  /* Toolbar */
  .toolbar {
    display:flex; align-items:center; gap:2px; padding:8px 20px;
    border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; flex-wrap:wrap;
  }
  .tool-btn {
    padding:6px 10px; background:none; border:1px solid transparent; color:var(--text);
    font-size:13px; cursor:pointer; border-radius:var(--radius); transition:all 0.15s; font-weight:500;
    font-family:'DM Sans',sans-serif;
  }
  .tool-btn:hover { background:var(--surface2); border-color:var(--border); }
  .tool-btn.active { background:rgba(91,155,213,0.15); border-color:var(--accent); color:var(--accent); }
  .tool-sep { width:1px; height:22px; background:var(--border); margin:0 6px; }
  .tool-select {
    padding:5px 8px; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-family:'DM Sans',sans-serif; font-size:12px; border-radius:var(--radius); cursor:pointer; outline:none;
  }

  /* Layout */
  .editor-layout { display:flex; flex:1; overflow:hidden; }

  /* Sidebar */
  .sidebar {
    width:240px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .sidebar-header {
    padding:16px 16px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-title { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); font-weight:500; }
  .sidebar-new {
    width:24px; height:24px; background:var(--accent); border:none; color:#000; border-radius:var(--radius);
    cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; font-weight:bold;
  }
  .doc-list { flex:1; overflow-y:auto; padding:8px; }
  .doc-list::-webkit-scrollbar { width:4px; }
  .doc-list::-webkit-scrollbar-track { background:transparent; }
  .doc-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .sidebar-doc {
    padding:10px 12px; border-radius:var(--radius); cursor:pointer; transition:background 0.15s;
    border:1px solid transparent; margin-bottom:2px; position:relative;
  }
  .sidebar-doc:hover { background:var(--surface2); }
  .sidebar-doc.active { background:rgba(91,155,213,0.1); border-color:rgba(91,155,213,0.3); }
  .sidebar-doc-title { font-size:13px; font-weight:500; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-doc-date { font-size:11px; color:var(--muted); }
  .sidebar-doc-del {
    position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--muted); cursor:pointer; opacity:0; font-size:14px; padding:2px 4px;
  }
  .sidebar-doc:hover .sidebar-doc-del { opacity:1; }
  .sidebar-doc-del:hover { color:#e85447; }
  .no-docs-msg { font-size:12px; color:var(--muted); padding:12px; text-align:center; line-height:1.5; }

  /* Editor */
  .editor-area { flex:1; overflow-y:auto; display:flex; justify-content:center; padding:40px 20px; background:var(--bg); }
  .editor-area::-webkit-scrollbar { width:6px; }
  .editor-area::-webkit-scrollbar-track { background:transparent; }
  .editor-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .page {
    width:100%; max-width:740px; min-height:1056px; background:#fff;
    box-shadow:0 4px 40px rgba(0,0,0,0.5); padding:80px 80px;
    color:#1a1a1a;
  }
  #editor {
    min-height:900px; outline:none; font-family:'Lora',serif; font-size:16px; line-height:1.8;
    color:#1a1a1a; caret-color:#1a1a1a;
  }
  #editor h1 { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:2px; margin-bottom:16px; color:#0a0a0a; }
  #editor h2 { font-family:'DM Sans',sans-serif; font-size:24px; font-weight:600; margin:24px 0 12px; color:#111; }
  #editor h3 { font-family:'DM Sans',sans-serif; font-size:18px; font-weight:600; margin:18px 0 8px; color:#222; }
  #editor p { margin-bottom:12px; }
  #editor ul, #editor ol { margin-left:24px; margin-bottom:12px; }
  #editor li { margin-bottom:4px; }
  #editor blockquote { border-left:3px solid #5b9bd5; margin:16px 0; padding:8px 16px; color:#555; font-style:italic; }
  #editor a { color:#5b9bd5; }
  #editor table { width:100%; border-collapse:collapse; margin-bottom:16px; }
  #editor td, #editor th { border:1px solid #ddd; padding:8px 12px; }
  #editor th { background:#f5f5f5; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; }
  #editor hr { border:none; border-top:1px solid #e0e0e0; margin:24px 0; }

  /* Guest banner */
  .guest-banner {
    display:none; align-items:center; justify-content:space-between;
    padding:10px 24px; background:rgba(232,197,71,0.1);
    border-bottom:1px solid rgba(232,197,71,0.25); flex-shrink:0;
  }
  .guest-banner.visible { display:flex; }
  .guest-banner-text { font-size:13px; color:var(--accent,#e8c547); font-weight:400; }
  .guest-banner-text span { opacity:0.7; font-weight:300; margin-left:8px; font-size:12px; }
  .guest-sign-in { padding:6px 16px; background:var(--accent,#e8c547); border:none; color:#000; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; border-radius:4px; }
  .guest-sign-in:hover { opacity:0.85; }

</style>
</head>
<body>

<div class="guest-banner" id="guest-banner">
  <div class="guest-banner-text">
    ⚡ You're using Forge as a guest
    <span>Your work won't be saved to the cloud</span>
  </div>
  <button class="guest-sign-in" onclick="window.location.href='index.html'">Sign In to Save</button>
</div>

<div class="topbar">
  <a href="index.html" class="home-link">FORGE</a>
  <div class="divider"></div>
  <span class="app-name">Quill</span>
  <div class="divider"></div>
  <input class="doc-title-input" id="doc-title" value="Untitled Document" placeholder="Document title...">
  <span class="save-status" id="save-status"></span>
  <button class="btn btn-accent" onclick="saveDocument()">Save</button>
  <button class="btn" onclick="newDocument()">+ New</button>
</div>

<div class="toolbar">
  <select class="tool-select" onchange="execFmt('formatBlock', this.value); this.value='p'">
    <option value="p">Paragraph</option>
    <option value="h1">Heading 1</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
  </select>
  <select class="tool-select" onchange="execFmt('fontSize', this.value); this.value='3'">
    <option value="1">8pt</option>
    <option value="2">10pt</option>
    <option value="3" selected>12pt</option>
    <option value="4">14pt</option>
    <option value="5">18pt</option>
    <option value="6">24pt</option>
    <option value="7">36pt</option>
  </select>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="execFmt('bold')" title="Bold"><b>B</b></button>
  <button class="tool-btn" onclick="execFmt('italic')" title="Italic"><i>I</i></button>
  <button class="tool-btn" onclick="execFmt('underline')" title="Underline"><u>U</u></button>
  <button class="tool-btn" onclick="execFmt('strikeThrough')" title="Strikethrough"><s>S</s></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="execFmt('justifyLeft')" title="Align Left">⬅</button>
  <button class="tool-btn" onclick="execFmt('justifyCenter')" title="Center">↔</button>
  <button class="tool-btn" onclick="execFmt('justifyRight')" title="Align Right">➡</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="execFmt('insertUnorderedList')" title="Bullet List">• List</button>
  <button class="tool-btn" onclick="execFmt('insertOrderedList')" title="Numbered List">1. List</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="insertLink()" title="Insert Link">🔗</button>
  <button class="tool-btn" onclick="execFmt('insertHorizontalRule')" title="Divider">—</button>
  <button class="tool-btn" onclick="insertTable()" title="Insert Table">⊞ Table</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="execFmt('undo')" title="Undo">↩</button>
  <button class="tool-btn" onclick="execFmt('redo')" title="Redo">↪</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="printDoc()" title="Print">🖨</button>
</div>

<div class="editor-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Documents</span>
      <button class="sidebar-new" onclick="newDocument()" title="New Document">+</button>
    </div>
    <div class="doc-list" id="doc-list">
      <div class="no-docs-msg">Loading...</div>
    </div>
  </div>
  <div class="editor-area">
    <div class="page">
      <div id="editor" contenteditable="true" spellcheck="true">
        <p>Start writing your document...</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jrhakmidckqpulfnksyt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyaGFrbWlkY2txcHVsZm5rc3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjQ5NzYsImV4cCI6MjA5NDU0MDk3Nn0.FhQEhpGhFw1NdcDtdNci1rbB4ATlB71rxuVp99Nv4mA';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, currentDocId = null, autoSaveTimer = null;

function execFmt(cmd, val=null) { document.execCommand(cmd, false, val); document.getElementById('editor').focus(); scheduleAutoSave(); }
function insertLink() { const url = prompt('Enter URL:'); if(url) execFmt('createLink', url); }
function insertTable() {
  const r = prompt('Rows:',3), c = prompt('Columns:',3);
  if(!r||!c) return;
  let html = '<table>';
  for(let i=0;i<r;i++) { html+='<tr>'; for(let j=0;j<c;j++) html+=i===0?'<th>Header</th>':'<td>&nbsp;</td>'; html+='</tr>'; }
  html+='</table>';
  document.execCommand('insertHTML', false, html);
}
function printDoc() { window.print(); }

function setStatus(msg, color='var(--muted)') {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = color;
}

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  setStatus('Unsaved changes', '#e8874a');
  autoSaveTimer = setTimeout(saveDocument, 3000);
}

async function saveDocument() {
  if (!currentUser) { guestSaveCheck(); return; }
  const title = document.getElementById('doc-title').value || 'Untitled Document';
  const content = document.getElementById('editor').innerHTML;
  setStatus('Saving...');
  const payload = { user_id: currentUser.id, app: 'quill', title, content, updated_at: new Date().toISOString() };
  let result;
  if (currentDocId) {
    const { data } = await sb.from('documents').update(payload).eq('id', currentDocId).select().single();
    result = data;
  } else {
    const { data } = await sb.from('documents').insert(payload).select().single();
    result = data;
    if (result) { currentDocId = result.id; history.replaceState(null,'',`?doc=${result.id}`); }
  }
  if (result) { setStatus('Saved ✓', 'var(--accent)'); await loadDocList(); }
  else setStatus('Save failed', '#e85447');
}

async function loadDoc(id) {
  const { data } = await sb.from('documents').select('*').eq('id', id).single();
  if (data) {
    currentDocId = data.id;
    document.getElementById('doc-title').value = data.title || 'Untitled Document';
    document.getElementById('editor').innerHTML = data.content || '';
    setStatus('');
    document.querySelectorAll('.sidebar-doc').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  }
}

async function loadDocList() {
  if (!currentUser) { document.getElementById('doc-list').innerHTML='<div class="no-docs-msg">Sign in to load<br>saved documents.</div>'; return; }
  const { data } = await sb.from('documents').select('*').eq('user_id', currentUser.id).eq('app', 'quill').order('updated_at', { ascending: false });
  const list = document.getElementById('doc-list');
  if (!data || data.length === 0) { list.innerHTML = '<div class="no-docs-msg">No documents yet.<br>Click + to create one.</div>'; return; }
  list.innerHTML = data.map(doc => `
    <div class="sidebar-doc ${doc.id===currentDocId?'active':''}" data-id="${doc.id}" onclick="loadDoc('${doc.id}')">
      <div class="sidebar-doc-title">${doc.title||'Untitled'}</div>
      <div class="sidebar-doc-date">${new Date(doc.updated_at).toLocaleDateString()}</div>
      <button class="sidebar-doc-del" onclick="event.stopPropagation();deleteDoc('${doc.id}')" title="Delete">✕</button>
    </div>`).join('');
}

async function deleteDoc(id) {
  if (!confirm('Delete this document?')) return;
  await sb.from('documents').delete().eq('id', id);
  if (id === currentDocId) newDocument();
  await loadDocList();
}

function newDocument() {
  currentDocId = null;
  document.getElementById('doc-title').value = 'Untitled Document';
  document.getElementById('editor').innerHTML = '<p>Start writing your document...</p>';
  setStatus('');
  history.replaceState(null,'','quill.html');
  document.querySelectorAll('.sidebar-doc').forEach(el => el.classList.remove('active'));
}

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  const isGuest = !user;
  if (!user && !sessionStorage.getItem('forge_guest')) { window.location.href = 'index.html'; return; }
  currentUser = user || null;
  if (isGuest) { document.getElementById('guest-banner').classList.add('visible'); }
  currentUser = user;
  await loadDocList();
  const params = new URLSearchParams(location.search);
  if (params.get('doc')) await loadDoc(params.get('doc'));
  document.getElementById('editor').addEventListener('input', scheduleAutoSave);
  document.getElementById('doc-title').addEventListener('input', scheduleAutoSave);
}

init();
// Guest save interception
function guestSaveCheck() {
  if (!currentUser) {
    if (confirm('You\'re using Forge as a guest. Sign in to save your work to the cloud.\n\nGo to sign in?')) {
      window.location.href = 'index.html';
    }
    return false;
  }
  return true;
}

</script>
</body>
</html>
